# Optional override: adds Postgres and Redis containers for self-hosters who
# don't already run them. setup.sh applies it only when the user picks
# "bundled" mode:
#   docker compose -f docker-compose.yaml -f docker-compose.bundled.yaml --env-file .env.production up -d --build

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: prowl
      POSTGRES_DB: prowl
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prowl -d prowl"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker-scrape:
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker-score:
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
