services:
  api:
    build: .
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    restart: unless-stopped
    environment:
      PYTHONPATH: /app
      TZ: Asia/Kolkata
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      SECRET_KEY: ${SECRET_KEY}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      FILTER_MODEL: ${FILTER_MODEL}
      SCORE_MODEL: ${SCORE_MODEL}
      INSIGHTS_MODEL: ${INSIGHTS_MODEL}
      REQUEST_DELAY: ${REQUEST_DELAY}
      MAX_JOBS_PER_COMPANY: ${MAX_JOBS_PER_COMPANY}
      LISTING_RETENTION_DAYS: ${LISTING_RETENTION_DAYS}
      FILTER_MODEL_PRICE_IN: ${FILTER_MODEL_PRICE_IN}
      FILTER_MODEL_PRICE_OUT: ${FILTER_MODEL_PRICE_OUT}
      SCORE_MODEL_PRICE_IN: ${SCORE_MODEL_PRICE_IN}
      SCORE_MODEL_PRICE_OUT: ${SCORE_MODEL_PRICE_OUT}
      SCORE_MODEL_CACHE_DISCOUNT: ${SCORE_MODEL_CACHE_DISCOUNT}
      NEXUS_NOTIFY_URL: ${NEXUS_NOTIFY_URL}
      NEXUS_API_KEY: ${NEXUS_API_KEY}
      PROWL_URL: ${PROWL_URL}

  worker:
    build: .
    command: celery -A celery_app worker --loglevel=info --concurrency=1 -I tasks
    restart: unless-stopped
    environment:
      PYTHONPATH: /app
      TZ: Asia/Kolkata
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      SECRET_KEY: ${SECRET_KEY}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      FILTER_MODEL: ${FILTER_MODEL}
      SCORE_MODEL: ${SCORE_MODEL}
      INSIGHTS_MODEL: ${INSIGHTS_MODEL}
      REQUEST_DELAY: ${REQUEST_DELAY}
      MAX_JOBS_PER_COMPANY: ${MAX_JOBS_PER_COMPANY}
      LISTING_RETENTION_DAYS: ${LISTING_RETENTION_DAYS}
      FILTER_MODEL_PRICE_IN: ${FILTER_MODEL_PRICE_IN}
      FILTER_MODEL_PRICE_OUT: ${FILTER_MODEL_PRICE_OUT}
      SCORE_MODEL_PRICE_IN: ${SCORE_MODEL_PRICE_IN}
      SCORE_MODEL_PRICE_OUT: ${SCORE_MODEL_PRICE_OUT}
      SCORE_MODEL_CACHE_DISCOUNT: ${SCORE_MODEL_CACHE_DISCOUNT}
      NEXUS_NOTIFY_URL: ${NEXUS_NOTIFY_URL}
      NEXUS_API_KEY: ${NEXUS_API_KEY}
      PROWL_URL: ${PROWL_URL}

  beat:
    build: .
    command: celery -A celery_app beat --loglevel=info
    restart: unless-stopped
    environment:
      PYTHONPATH: /app
      TZ: Asia/Kolkata
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      SECRET_KEY: ${SECRET_KEY}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      FILTER_MODEL: ${FILTER_MODEL}
      SCORE_MODEL: ${SCORE_MODEL}
      INSIGHTS_MODEL: ${INSIGHTS_MODEL}
      REQUEST_DELAY: ${REQUEST_DELAY}
      MAX_JOBS_PER_COMPANY: ${MAX_JOBS_PER_COMPANY}
      LISTING_RETENTION_DAYS: ${LISTING_RETENTION_DAYS}
      FILTER_MODEL_PRICE_IN: ${FILTER_MODEL_PRICE_IN}
      FILTER_MODEL_PRICE_OUT: ${FILTER_MODEL_PRICE_OUT}
      SCORE_MODEL_PRICE_IN: ${SCORE_MODEL_PRICE_IN}
      SCORE_MODEL_PRICE_OUT: ${SCORE_MODEL_PRICE_OUT}
      SCORE_MODEL_CACHE_DISCOUNT: ${SCORE_MODEL_CACHE_DISCOUNT}
      NEXUS_NOTIFY_URL: ${NEXUS_NOTIFY_URL}
      NEXUS_API_KEY: ${NEXUS_API_KEY}
      PROWL_URL: ${PROWL_URL}

  nginx:
    build:
      context: frontend
      dockerfile: Dockerfile
    depends_on:
      - api
    restart: unless-stopped
