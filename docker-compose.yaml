services:
  api:
    build: .
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    restart: unless-stopped
    environment:
      PYTHONPATH: /app
      TZ: Asia/Kolkata
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      SECRET_KEY: ${SECRET_KEY}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      PROWL_URL: ${PROWL_URL}
    networks:
      - default
      - coolify

  worker:
    build: .
    command: celery -A celery_app worker --loglevel=info --concurrency=1 -I tasks
    restart: unless-stopped
    environment:
      PYTHONPATH: /app
      TZ: Asia/Kolkata
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      SECRET_KEY: ${SECRET_KEY}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      PROWL_URL: ${PROWL_URL}
    networks:
      - default
      - coolify

  beat:
    build: .
    command: celery -A celery_app beat --loglevel=info
    restart: unless-stopped
    environment:
      PYTHONPATH: /app
      TZ: Asia/Kolkata
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      SECRET_KEY: ${SECRET_KEY}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      PROWL_URL: ${PROWL_URL}
    networks:
      - default
      - coolify

  nginx:
    build:
      context: frontend
      dockerfile: Dockerfile
    depends_on:
      - api
    restart: unless-stopped

networks:
  coolify:
    external: true
