services:
  api:
    build: .
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    restart: unless-stopped
    environment:
      PYTHONPATH: /app
      TZ: Asia/Kolkata
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      SECRET_KEY: ${SECRET_KEY}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      PROWL_URL: ${PROWL_URL}
    # Lets DATABASE_URL/REDIS_URL point at a Postgres/Redis running on the host
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default
      - coolify

  worker-scrape:
    build: .
    # Scrape runs + the lightweight scheduler/cleanup tasks share this pool so a
    # long-running scoring job (worker-score) can never delay a scheduled scrape.
    command: celery -A celery_app worker --loglevel=info --concurrency=${CELERY_SCRAPE_CONCURRENCY:-2} -Q scrape,default -n scrape@%h -I tasks
    restart: unless-stopped
    environment:
      PYTHONPATH: /app
      TZ: Asia/Kolkata
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      SECRET_KEY: ${SECRET_KEY}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      PROWL_URL: ${PROWL_URL}
    # Lets DATABASE_URL/REDIS_URL point at a Postgres/Redis running on the host
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default
      - coolify

  worker-score:
    build: .
    # Isolated pool for per-user LLM scoring runs so multiple users' runs can
    # execute concurrently instead of queueing behind each other one-at-a-time.
    command: celery -A celery_app worker --loglevel=info --concurrency=${CELERY_SCORE_CONCURRENCY:-4} -Q score -n score@%h -I tasks
    restart: unless-stopped
    environment:
      PYTHONPATH: /app
      TZ: Asia/Kolkata
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      SECRET_KEY: ${SECRET_KEY}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      PROWL_URL: ${PROWL_URL}
    # Lets DATABASE_URL/REDIS_URL point at a Postgres/Redis running on the host
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default
      - coolify

  beat:
    build: .
    command: celery -A celery_app beat --loglevel=info
    restart: unless-stopped
    environment:
      PYTHONPATH: /app
      TZ: Asia/Kolkata
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      SECRET_KEY: ${SECRET_KEY}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      PROWL_URL: ${PROWL_URL}
    # Lets DATABASE_URL/REDIS_URL point at a Postgres/Redis running on the host
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default
      - coolify

  nginx:
    build:
      context: frontend
      dockerfile: Dockerfile
    expose:
      - "80"
    depends_on:
      - api
    restart: unless-stopped

networks:
  coolify:
    external: true
