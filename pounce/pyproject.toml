[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pounce"
version = "0.1.0"
description = "Self-learning job application bot for The Prowl platform"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "httpx>=0.27",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "apscheduler>=3.10",
    "sqlalchemy>=2.0",
]

[project.scripts]
pounce = "pounce.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["pounce"]
